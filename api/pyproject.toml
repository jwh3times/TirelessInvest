[project]
name = "tirelessinvest"
# Not the product version: that is the vX.Y.Z tag on each merge, with its line in /VERSION.
version = "0.0.0"
description = "Backtesting engine and API for TirelessInvest"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=2.1",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tirelessinvest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Starlette's TestClient runs on httpx2 (a dev dependency) and warns when it falls back to httpx.
# Make that, or any other Starlette deprecation the tests hit, an error rather than a warning.
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "tirelessinvest.access.require_permission"]
