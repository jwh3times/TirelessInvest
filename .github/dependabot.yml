# Dependabot version updates, checked every day at 05:00 US Eastern. Security updates are a
# repository setting (Settings > Advanced Security) and are not limited by the schedule here.
#
# Minor and patch updates arrive as one pull request per ecosystem. Majors arrive one at a time,
# except for families that only work at matching versions, which travel together.
version: 2
updates:
  # The API: api/pyproject.toml and api/uv.lock.
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: daily
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # The web app: web/package.json and web/pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: daily
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
    groups:
      # react and react-dom must be the same version at runtime, and the types follow them.
      react:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
      # The React plugin needs a matching Vite major.
      vite:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/plugin-react"
        update-types:
          - major
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # The API image's base (api/Dockerfile).
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: daily
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)

  # Action versions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
