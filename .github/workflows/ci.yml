name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # Match the FROM line in api/Dockerfile, which is what production runs.
          python-version: "3.15"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_API_URL: http://127.0.0.1:8000

  # Agent config and docs. The scripts need no dependencies, so nothing is installed.
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # .claude/skills/ mirrors .agents/skills/, and the shared AGENTS.md blocks are current.
      - name: Generated agent config is in sync
        run: node scripts/sync-agents.mjs --check

      - name: Installed skills match the lock
        run: node scripts/check-skills.mjs

      # Skill and agent sources are read from their mirrored copies too: a bare $0-$9 in a
      # SKILL.md or a relative link that breaks there fails here.
      - name: Skill and agent sources are tool-neutral
        run: node scripts/lint-agent-neutrality.mjs

      # Local links and anchors resolve, and the doc map lists every document.
      - name: Docs links and doc map
        run: node scripts/check-docs.mjs

      - name: Script tests
        run: node --test "scripts/*.test.mjs"
