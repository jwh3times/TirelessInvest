name: Release

# Every merge to main is a release (GLOSSARY.md): it mints the next version and goes to
# production in a fixed order (docs/adr/0001-railway-applies-migrations-at-deploy.md).
#
#   1. Railway builds the api and price-sync images from this commit on its own, and their
#      pre-deploy step applies pending migrations before traffic switches. Nothing here drives it.
#   2. `tag` stamps the changelog and tags the merge commit v<major>.<minor>.<build>
#      (`Scheme: stamp-on-tag`, docs/adr/0003-stamp-changelog-on-tag.md). It is minted whether or
#      not the deploy succeeds; a failed deploy is fixed forward with the next release.
#   3. `web` waits for the API's /health to report this commit, then builds the web app with the
#      version and commit and deploys it to Cloudflare Pages. The web app never ships ahead of
#      the API it calls.
#
# `tag` runs `scripts/stamp-changelog.mjs`, which walks main's first-parent history back to the
# newest three-part tag and, for each untagged merge, oldest first, builds its dated CHANGELOG.md
# section from the `changelog.d/` fragments that merge added (or from its PR title when it added
# none, as a Dependabot merge does), computes its version from VERSION the way
# `scripts/next-version.mjs` does, and tags the merge commit itself. One stamp commit,
# `chore(release): v<x.y.z>[, ...] [skip ci]`, adds the sections and deletes the fragments; the
# job pushes it and the tags in one atomic push and creates a GitHub Release per tag.
#
# The push uses a token from the release GitHub App, the main ruleset's one bypass actor:
# `GITHUB_TOKEN` cannot bypass a ruleset. The App's client ID is the RELEASE_APP_CLIENT_ID variable
# and its private key the RELEASE_APP_PRIVATE_KEY secret, both in the `production` environment, so
# only a run on `main` can mint a token that bypasses its ruleset. `[skip ci]` keeps the stamp
# commit from starting CI or this workflow. Railway ignores it: the services' watch paths exclude
# `CHANGELOG.md` and `changelog.d/`, the only files a stamp commit touches, so Railway skips it.
# Without them, its deploy superseded the merge's and failed, and `web` timed out (ADR 0003).
#
# Railway's "Wait for CI" must stay off: it would hold the API deploy until this workflow
# finished, while `web` waits for the API, and neither would move.

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  API_HEALTH_URL: https://api.tirelessinvest.com/health
  PAGES_PROJECT: tirelessinvest

jobs:
  tag:
    name: Stamp the changelog and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Limited to main, like `web`, so no other branch's workflow can read the App's private key.
    environment: production
    permissions:
      contents: write # gh release create with GITHUB_TOKEN
    # Stamps take turns and never cancel a running one. GitHub still replaces a waiting run when a
    # newer one queues; that is harmless, because a stamp starts from main's tip and releases every
    # untagged merge, and the newer run's `web` deploys a web app that contains the replaced one.
    concurrency:
      group: release-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: main # main's tip, not the pushed commit: a later merge may already be on it
          fetch-depth: 0 # full history and tags, needed to find the untagged merges
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Stamp the changelog and push the tags
        id: stamp
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"

          node scripts/stamp-changelog.mjs --notes-dir "$RUNNER_TEMP/notes" > "$RUNNER_TEMP/tags.txt"
          if [ ! -s "$RUNNER_TEMP/tags.txt" ]; then
            echo "Every merge on main is tagged; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            echo "result=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags=$(cut -d' ' -f1 "$RUNNER_TEMP/tags.txt")

          refs=()
          for tag in $tags; do refs+=("refs/tags/${tag}"); done
          if ! git push --atomic origin HEAD:main "${refs[@]}" 2> "$RUNNER_TEMP/push.log"; then
            cat "$RUNNER_TEMP/push.log" >&2
            # Only main moving is benign: the run waiting behind this one stamps both merges, and
            # its `web` deploys a web app that contains this one.
            if grep -Eq 'HEAD -> main \((fetch first|non-fast-forward)\)' "$RUNNER_TEMP/push.log"; then
              echo "::notice::main moved during this run; the next run releases and deploys these merges."
              echo "result=deferred" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          cat "$RUNNER_TEMP/push.log" >&2
          echo "result=released" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Releases
        if: steps.stamp.outputs.result == 'released'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "### Released" >> "$GITHUB_STEP_SUMMARY"
          while read -r tag sha; do
            gh release create "$tag" \
              --verify-tag \
              --title "TirelessInvest ${tag#v}" \
              --notes-file "$RUNNER_TEMP/notes/${tag}.md"
            echo "- \`${tag}\` on \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/tags.txt"

      # The version `web` builds into the app: the tag on the commit this run was started for, which
      # this run or an earlier one stamped. A deferred run leaves it empty and skips `web`.
      - name: Version of this merge
        id: version
        if: steps.stamp.outputs.result != 'deferred'
        run: |
          tag=$(git tag --list 'v*' --points-at "$GITHUB_SHA" |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$tag" ]; then
            echo "::error::No version tag is on ${GITHUB_SHA} after the stamp."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "### \`${tag}\` is \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Deploy the web app after the API
    needs: tag
    if: needs.tag.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Restricted to main, so pull request and Dependabot workflows can't read its secret.
    environment: production
    # One web deploy at a time, in merge order. A queued run that a newer one replaces is
    # cancelled, which is fine: the newer run deploys a newer web app.
    concurrency:
      group: release-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history, to recognize a newer API commit that contains this one

      # Railway skips the stamp commit that follows this merge (its watch paths), so the API reports
      # this commit, or a later merge's, which the ancestry check accepts.
      - name: Wait for the API to run this commit or a later one
        run: |
          deadline=$(( $(date +%s) + 15 * 60 ))
          while :; do
            commit=$(curl -fsS --max-time 10 "$API_HEALTH_URL" | jq -r '.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "The API is running ${GITHUB_SHA}."
              break
            fi
            # A later merge may already be live; this commit is then part of what the API runs.
            if [ -n "$commit" ] && git fetch -q origin main &&
              git merge-base --is-ancestor "$GITHUB_SHA" "$commit" 2>/dev/null; then
              echo "The API is running ${commit}, which includes ${GITHUB_SHA}."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::After 15 minutes the API still reports '${commit:-nothing}', not ${GITHUB_SHA}. Check the api deploy in Railway; the web app was not deployed."
              exit 1
            fi
            sleep 20
          done

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build
        working-directory: web
        env:
          # Public values: they end up in every visitor's browser (docs/INFRASTRUCTURE.md §5.2).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_VERSION: ${{ needs.tag.outputs.version }}
          VITE_APP_COMMIT: ${{ github.sha }}
        run: pnpm build

      - name: Load the Cloudflare token
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://TirelessInvest CI/Cloudflare Pages deploy/credential
          CLOUDFLARE_ACCOUNT_ID: op://TirelessInvest CI/Cloudflare Pages deploy/account id

      - name: Deploy to Cloudflare Pages
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: >-
          npx --yes wrangler@4 pages deploy web/dist
          --project-name "$PAGES_PROJECT"
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "v$VERSION"
