# Project MCP servers for Codex; Codex loads this file only once the project is trusted.
# Keep it in step with .mcp.json (Claude Code). AGENTS.md says why each server is here.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.cloudflare-api]
url = "https://mcp.cloudflare.com/mcp"

[mcp_servers.railway]
url = "https://mcp.railway.com"
# Prompt for every tool Railway doesn't mark read-only; .claude/settings.json lists the same gate.
default_tools_approval_mode = "writes"

# Reads that return production secrets, and the open-ended agent, prompt too.
[mcp_servers.railway.tools.list-variables]
approval_mode = "prompt"

[mcp_servers.railway.tools.get-bucket-credentials]
approval_mode = "prompt"

[mcp_servers.railway.tools.railway-agent]
approval_mode = "prompt"

[mcp_servers.supabase-local]
url = "http://localhost:54321/mcp"
